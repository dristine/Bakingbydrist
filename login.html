<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Masuk | Baking by Drist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="auth.css" />
    <script src="login.js" defer></script>
  </head>
  <body>
    <div class="top-shape"></div>
    <a class="logo" href="index.html"
      ><div class="auth-logo">
        <img
          src="ChatGPT_Image_Oct_7__2026__10_41_54_AM-removebg-preview.png"
          alt="Baking by Drist"
        /></div
    ></a>
    <main class="auth-card">
      <header>
        <h1>Masuk Untuk<br />menikmati momen manis</h1>
        <p>
          Masuk ke akun Anda untuk melihat menu, pesanan, dan pengalaman khusus
          dari Baking by Drist.
        </p>
      </header>
      <form id="loginForm">
        <label for="email">Email</label>
        <div class="field">
          <span>✉</span
          ><input
            id="email"
            type="email"
            placeholder="nama@email.com"
            required
          />
        </div>
        <label for="password">Kata Sandi</label>
        <div class="field">
          <span>♙</span
          ><input
            id="password"
            type="password"
            placeholder="Masukkan kata sandi"
            required
          /><button type="button" class="toggle" data-target="password">
            ◉
          </button>
        </div>
        <div class="options">
          <label><input type="checkbox" /> Ingat saya</label
          ><a href="#" id="forgot">Lupa kata sandi?</a>
        </div>
        <button class="submit" type="submit">Masuk</button>
      </form>
      <p class="switch">Belum punya akun? <a href="regis.html">Daftar</a></p>
    </main>
  </body>
</html>
